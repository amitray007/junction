# gitleaks configuration — extends the default ruleset.
# https://github.com/gitleaks/gitleaks

[extend]
useDefault = true

[allowlist]
description = "Fake test sentinels — deliberately high-entropy constants used to prove a credential never reaches tool output. Never real secrets."
regexes = [
  # openapi-client credential-leak test sentinel (http-exec.test.ts).
  '''s3cr3t-sentinel-abc123''',
  # source-runtime verify-credential secret-discipline test sentinel (inc 28.9).
  '''sentinel-verify-secret-xyz789''',
  # code-mode leak-test sentinel (inc 33, quickjs-executor.test.ts) — the current
  # source assembles it from parts at runtime, but an earlier commit in-range held
  # the literal, and gitleaks-action scans PR history. Never a real key.
  '''sk_live_PLANTED_SECRET_[0-9a-f]+''',
]
