name: Security
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  pull-requests: read
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-publish-guard:
    # Locks in the publish-disabled invariant (increment 0.75): junction
    # must never gain an npm-publish path until deliberately enabled.
    name: no-publish-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert no npm-publish path exists
        # Scans ci.yml + release.yml (not this file, to avoid matching the
        # patterns below). Fails if a real publish path or npm auth token appears.
        shell: bash
        run: |
          fail=0
          if grep -EHn 'changeset publish|npm publish|pnpm publish' \
               .github/workflows/ci.yml .github/workflows/release.yml; then
            echo "::error::An npm-publish path was introduced. Publishing is intentionally disabled (increment 0.75)."
            fail=1
          fi
          if grep -EHn 'NODE_AUTH_TOKEN|NPM_TOKEN' \
               .github/workflows/ci.yml .github/workflows/release.yml; then
            echo "::error::An npm auth token was introduced. Publishing is intentionally disabled."
            fail=1
          fi
          exit $fail

  type-coverage:
    # Increment 32.1 — locks the type-coverage floor so `any` can't silently
    # creep into a credential broker. tsconfig.typecoverage.json is a
    # dedicated, explicit-include config (root tsconfig's project references
    # make type-coverage report a false 0/0 success — see the config's
    # doc-review note); measured source-only aggregate is ~99.4%, so the
    # gate is set at the honest floor of 99, not weakened.
    name: type-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-coverage:check

  spdx-header-guard:
    # Increment 32.1 — locks in the SPDX-header-on-every-source-file
    # invariant (docs/futures/revisit-when.md). Mirrors the no-publish-guard
    # bash-gate idiom above: a plain grep gate, zero new config/dependency.
    name: spdx-header-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assert every tracked source file carries an SPDX header
        shell: bash
        run: |
          fail=0
          missing=()
          while IFS= read -r f; do
            case "$f" in
              */dist/*|*/dist-tsc/*) continue ;;
            esac
            # -a: force text mode — a legitimate NUL byte inside a source
            # string literal can make grep mis-detect a UTF-8 file as binary
            # and silently skip it otherwise (found during this gate's own
            # authoring: packages/web/src/server/data.server.ts).
            if ! grep -aq "SPDX-License-Identifier" "$f"; then
              missing+=("$f")
              fail=1
            fi
          done < <(git ls-files '*.ts' '*.tsx')
          if [ "$fail" -ne 0 ]; then
            echo "::error::Tracked source file(s) missing SPDX-License-Identifier:"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All tracked *.ts/*.tsx files carry an SPDX header."

  osv-scanner:
    # Increment 32.1 — dependency CVE scan, complements the existing
    # non-blocking `pnpm audit` in the `quality` npm script (package.json;
    # left untouched). Pinned to the osv-scanner-action release commit SHA
    # per the repo's third-party-action pinning policy (see denoland/gitleaks
    # above). The action's own exit code reflects "any vuln found" (osv-scanner
    # has no built-in severity-threshold flag); continue-on-error lets a
    # follow-up step read the JSON report and gate on high/critical only,
    # matching the gitleaks/no-publish-guard blocking posture without failing
    # on low/medium noise.
    name: osv-scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run osv-scanner (report-only step — severity gate follows)
        id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            --format=json
            --output-file=osv-results.json
            ./
      - name: Gate on high/critical severity only
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, sys

          try:
              with open("osv-results.json") as f:
                  data = json.load(f)
          except FileNotFoundError:
              print("No osv-results.json produced — treating as no findings.")
              sys.exit(0)

          HIGH_THRESHOLD = 7.0  # CVSS >= 7.0 == High/Critical (matches gitleaks blocking posture)
          high_or_critical = []

          for result in data.get("results", []):
              source = result.get("source", {}).get("path", "?")
              for pkg in result.get("packages", []):
                  name = pkg.get("package", {}).get("name", "?")
                  for group in pkg.get("groups", []):
                      max_sev = group.get("max_severity", "")
                      try:
                          score = float(max_sev)
                      except (TypeError, ValueError):
                          score = 0.0
                      if score >= HIGH_THRESHOLD:
                          high_or_critical.append(f"{source}: {name} (CVSS {max_sev}, ids={group.get('ids')})")

          if high_or_critical:
              print("::error::High/critical severity vulnerabilities found:")
              for line in high_or_critical:
                  print(f"  {line}")
              sys.exit(1)

          print("No high/critical severity vulnerabilities found.")
          PYEOF
