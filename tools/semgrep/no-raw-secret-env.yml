# SPDX-License-Identifier: AGPL-3.0-only
# Increment 32.12 — no raw secret env var access outside the vault/config
# layer (rule 4 of 8).
#
# process.env keys matching SECRET/TOKEN/_KEY/PASSPHRASE/PASSWORD should only
# be read from core/src/credentials/** (the vault) or core/src/config/**
# (config load) — anywhere else in the tree reading a raw secret env var is a
# strong signal of a credential leak path bypassing the vault.
#
# NOTE on metavariable-regex: semgrep's metavariable-regex is a FULLMATCH,
# not a substring search — the pattern must be wrapped in `.*(...).* ` to
# match a key that merely CONTAINS one of the SECRET/TOKEN/etc. substrings
# (verified locally: an unwrapped `(?i)(SECRET|TOKEN|...)` matched nothing
# against `API_SECRET_TOKEN`; wrapping in `.*...*` fixed it).
rules:
  - id: no-raw-secret-env-outside-vault
    languages: [typescript]
    severity: ERROR
    message: >-
      process.env accessed with a key matching
      /SECRET|TOKEN|_KEY|PASSPHRASE|PASSWORD/i outside
      packages/core/src/credentials/** or packages/core/src/config/**.
      Secret-shaped env vars should be read only inside the vault/config
      layer. If this is a deliberate, justified exception, suppress with a
      `// nosemgrep: no-raw-secret-env-outside-vault — <reason>` comment at
      the call site.
    patterns:
      - pattern-either:
          - pattern: process.env.$KEY
          - pattern: process.env[$KEY]
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(SECRET|TOKEN|_KEY|PASSPHRASE|PASSWORD).*
    paths:
      include:
        - "**/packages/**/*.ts"
        - "**/packages/**/*.tsx"
      exclude:
        - "**/packages/**/*.test.ts"
        - "**/packages/**/*.test.tsx"
        - "**/packages/core/src/credentials/**"
        - "**/packages/core/src/config/**"
