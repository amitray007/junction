# Increment 32.12 — sandbox boundary rule (rule 1 of 8).
#
# child_process (execSync/spawnSync/spawn/exec/execFile) may only be used
# inside packages/core/src/sandbox/** (the sandbox backends themselves) or
# packages/core/src/sources/cli/** (the cli-source provider, which
# legitimately shells out to run a user-configured CLI tool as its whole
# purpose). Anywhere else in packages/, spawning a subprocess bypasses the
# sandbox capability model entirely.
rules:
  - id: no-child-process-outside-sandbox
    languages: [typescript]
    severity: ERROR
    message: >-
      node:child_process (spawn/exec/execFile/*Sync) used outside the sandbox
      backends (packages/core/src/sandbox/**) or the cli-source provider
      (packages/core/src/sources/cli/**). Subprocess execution outside those
      two places bypasses the sandbox capability model. If this is a
      deliberate, narrowly-scoped exception (e.g. opening a URL in the system
      browser via a fixed binary + validated args, never a user-controlled
      command string), suppress with a `// nosemgrep:
      no-child-process-outside-sandbox — <reason>` comment at the call site,
      not a path exclusion.
    patterns:
      - pattern-either:
          - pattern: import { ... } from "node:child_process"
          - pattern: import { ... } from "child_process"
          - pattern: import $X from "node:child_process"
          - pattern: require("node:child_process")
          - pattern: require("child_process")
    paths:
      include:
        - "**/packages/**/*.ts"
        - "**/packages/**/*.tsx"
      exclude:
        - "**/packages/**/*.test.ts"
        - "**/packages/**/*.test.tsx"
        - "**/packages/core/src/sandbox/**"
        - "**/packages/core/src/sources/cli/**"
